<svg viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be123c"/>
    </marker>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Patient voice bot — how one call works</text>
  <text x="40" y="74" font-size="14" fill="#64748b">Python + LiveKit Agents in pipeline mode · separate STT / LLM / TTS · one hardcoded destination</text>

  <!-- ================= ONE-TIME SETUP ================= -->
  <text x="40" y="112" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ONE-TIME SETUP</text>
  <g>
    <rect x="40" y="122" width="140" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="110" y="145" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">.env</text>
    <text x="110" y="161" font-size="11" fill="#64748b" text-anchor="middle">keys + Twilio trunk</text>

    <line x1="182" y1="145" x2="218" y2="145" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="220" y="122" width="170" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="305" y="145" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">setup_trunk.py</text>
    <text x="305" y="161" font-size="11" fill="#3b82f6" text-anchor="middle">idempotent</text>

    <line x1="392" y1="145" x2="428" y2="145" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="430" y="122" width="250" height="46" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="555" y="145" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">LiveKit SIP outbound trunk</text>
    <text x="555" y="161" font-size="11" fill="#b45309" text-anchor="middle">points at the Twilio termination URI</text>

    <text x="700" y="141" font-size="12" fill="#64748b">Two trunk objects because each side knows half the problem:</text>
    <text x="700" y="158" font-size="12" fill="#64748b">LiveKit needs somewhere to send SIP; Twilio terminates onto the PSTN.</text>
  </g>

  <line x1="40" y1="190" x2="1240" y2="190" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= PER CALL ================= -->
  <text x="40" y="216" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">PER CALL</text>

  <!-- runner -->
  <rect x="40" y="228" width="210" height="168" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="254" font-size="15" font-weight="700" fill="#1e3a8a">run_calls.py</text>
  <text x="60" y="278" font-size="12" fill="#334155">starts the agent worker</text>
  <text x="60" y="298" font-size="12" fill="#334155">one dispatch per scenario</text>
  <text x="60" y="318" font-size="12" fill="#334155">waits for the transcript</text>
  <text x="60" y="338" font-size="12" fill="#334155">retries a failed call once</text>
  <text x="60" y="366" font-size="11" fill="#3b82f6">preflight.py checks everything</text>
  <text x="60" y="382" font-size="11" fill="#3b82f6">first, for free</text>

  <path d="M252 300 L296 300" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="274" y="292" font-size="10" fill="#64748b" text-anchor="middle">dispatch</text>

  <!-- agent -->
  <rect x="300" y="228" width="470" height="392" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="254" font-size="15" font-weight="700" fill="#0f172a">src/patient.py — AgentSession</text>
  <text x="320" y="272" font-size="11" fill="#64748b">pipeline mode: three separate models, no speech-to-speech</text>

  <rect x="320" y="286" width="430" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="336" y="305" font-size="12.5" font-weight="600" fill="#0f172a">scenarios/*.yaml + base_prompt.md</text>
  <text x="336" y="321" font-size="11" fill="#64748b">14 personas → the system prompt for this call</text>

  <!-- the three stages -->
  <rect x="320" y="344" width="136" height="74" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="388" y="366" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">STT</text>
  <text x="388" y="384" font-size="11.5" fill="#6d28d9" text-anchor="middle">Deepgram</text>
  <text x="388" y="400" font-size="11.5" fill="#6d28d9" text-anchor="middle">nova-3</text>

  <path d="M460 381 L484 381" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="487" y="344" width="136" height="74" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="555" y="366" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">LLM</text>
  <text x="555" y="384" font-size="11.5" fill="#6d28d9" text-anchor="middle">Claude Haiku 4.5</text>
  <text x="555" y="400" font-size="11.5" fill="#6d28d9" text-anchor="middle">max_tokens 60</text>

  <path d="M627 381 L651 381" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="654" y="344" width="96" height="74" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="702" y="366" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">TTS</text>
  <text x="702" y="384" font-size="11.5" fill="#6d28d9" text-anchor="middle">Cartesia</text>
  <text x="702" y="400" font-size="11.5" fill="#6d28d9" text-anchor="middle">Sonic-3</text>

  <!-- turn taking -->
  <rect x="320" y="434" width="430" height="74" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="336" y="455" font-size="12.5" font-weight="700" fill="#0e7490">Turn-taking — Silero VAD + LiveKit turn detector</text>
  <text x="336" y="473" font-size="11.5" fill="#155e75">VAD: is anyone speaking · detector: is the turn actually over</text>
  <text x="336" y="491" font-size="11.5" fill="#155e75">endpointing 0.25–2.0s · preemptive generation · barge-in ≥0.4s / 2 words</text>

  <!-- guard -->
  <rect x="320" y="524" width="430" height="74" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="336" y="545" font-size="12.5" font-weight="700" fill="#be123c">assert_allowed_number()  →  ctx.add_sip_participant()</text>
  <text x="336" y="563" font-size="11.5" fill="#9f1239">The only place in the project that can dial. The number is a constant</text>
  <text x="336" y="580" font-size="11.5" fill="#9f1239">in src/config.py — not env, not a flag. preflight asserts both.</text>

  <!-- ================= TELEPHONY COLUMN ================= -->
  <path d="M772 560 L828 560" stroke="#be123c" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="836" y="228" width="230" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="951" y="252" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">LiveKit Cloud — SIP</text>
  <text x="951" y="270" font-size="11" fill="#b45309" text-anchor="middle">room ↔ SIP bridge</text>

  <line x1="951" y1="286" x2="951" y2="314" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="836" y="316" width="230" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="951" y="340" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">Twilio Elastic SIP Trunk</text>
  <text x="951" y="358" font-size="11" fill="#b45309" text-anchor="middle">one outbound caller ID</text>

  <line x1="951" y1="374" x2="951" y2="402" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="836" y="404" width="230" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="951" y="432" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">PSTN</text>

  <line x1="951" y1="450" x2="951" y2="478" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="836" y="480" width="230" height="118" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="1.8"/>
  <text x="951" y="506" font-size="14" font-weight="700" fill="#9f1239" text-anchor="middle">+1 805 439 8008</text>
  <text x="951" y="528" font-size="12" fill="#be123c" text-anchor="middle">Pivot Point Orthopaedics</text>
  <text x="951" y="546" font-size="12" fill="#be123c" text-anchor="middle">AI receptionist</text>
  <text x="951" y="570" font-size="11" fill="#9f1239" text-anchor="middle" font-style="italic">the system under test</text>
  <text x="951" y="588" font-size="11" fill="#9f1239" text-anchor="middle" font-style="italic">— everything else is ours</text>

  <!-- audio loop -->
  <path d="M1086 300 C1150 300 1150 470 1086 470" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#aq)"/>
  <text x="1160" y="378" font-size="11.5" fill="#0f766e">their speech in</text>
  <text x="1160" y="395" font-size="11.5" fill="#0f766e">our speech out</text>
  <text x="1160" y="412" font-size="11" fill="#14b8a6">live audio, both ways</text>

  <line x1="40" y1="648" x2="1240" y2="648" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= OUTPUTS ================= -->
  <text x="40" y="676" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">WHAT EACH CALL LEAVES BEHIND</text>

  <rect x="40" y="690" width="250" height="92" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="60" y="714" font-size="13.5" font-weight="700" fill="#065f46">recordings/call-NN.ogg</text>
  <text x="60" y="734" font-size="11.5" fill="#047857">stereo OGG/Opus</text>
  <text x="60" y="752" font-size="11.5" fill="#047857">ch 0 = receptionist</text>
  <text x="60" y="770" font-size="11.5" fill="#047857">ch 1 = our patient</text>

  <rect x="306" y="690" width="230" height="92" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="326" y="714" font-size="13.5" font-weight="700" fill="#065f46">transcripts/call-NN.txt</text>
  <text x="326" y="734" font-size="11.5" fill="#047857">timestamped, speaker-labelled</text>
  <text x="326" y="752" font-size="11.5" fill="#047857">written the moment the call</text>
  <text x="326" y="770" font-size="11.5" fill="#047857">ends, not at shutdown</text>

  <path d="M292 736 L302 736" stroke="#475569" stroke-width="1.6"/>
  <path d="M538 736 L578 736" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="582" y="690" width="238" height="92" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="602" y="714" font-size="13.5" font-weight="700" fill="#1e3a8a">src/pacing.py</text>
  <text x="602" y="734" font-size="11.5" fill="#1d4ed8">measures the audio per channel:</text>
  <text x="602" y="752" font-size="11.5" fill="#1d4ed8">response latency, think time,</text>
  <text x="602" y="770" font-size="11.5" fill="#1d4ed8">who talked over whom</text>

  <path d="M822 736 L862 736" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="866" y="690" width="196" height="92" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="886" y="714" font-size="13.5" font-weight="700" fill="#1e3a8a">analyze.py</text>
  <text x="886" y="734" font-size="11.5" fill="#1d4ed8">Claude Opus 5 judges</text>
  <text x="886" y="752" font-size="11.5" fill="#1d4ed8">the conversation, given</text>
  <text x="886" y="770" font-size="11.5" fill="#1d4ed8">the measured numbers</text>

  <path d="M1064 736 L1096 736" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="1100" y="690" width="140" height="92" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1170" y="726" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">BUG_REPORT</text>
  <text x="1170" y="744" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">.md</text>
  <text x="1170" y="764" font-size="11" fill="#64748b" text-anchor="middle">hand-reviewed</text>

  <path d="M535 622 L535 664 L165 664 L165 686" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="40" y="812" font-size="11.5" fill="#64748b">Timing is measured from the audio, never inferred from transcript timestamps — those record when a reply was generated, not when it reached the line.</text>
  <text x="40" y="832" font-size="11.5" fill="#64748b">Each provider is a one-line swap in .env (STT_PROVIDER / LLM_PROVIDER / TTS_PROVIDER / TURN_DETECTOR), so one variable can change per call and be attributed.</text>
</svg>
